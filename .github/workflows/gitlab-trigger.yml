name: Sync GitHub to GitLab
on:
  push:
    branches:
      - main
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN_TWO }}@gitlab.com/khushiary-a/TaskFlowApi.git
          git push gitlab main --force
      - name: Trigger GitLab Pipeline
        run: |
          curl -X POST "https://gitlab.com/api/v4/projects/81841041/trigger/pipeline" \
          --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
          --form ref=main
