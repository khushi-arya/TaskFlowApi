<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-success:hover {
            background: #218838;
        }

        .tasks-section {
            margin-top: 30px;
        }

        .tasks-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .task-item {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 15px;
        }

        .task-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .task-item.completed {
            background: #f8f9fa;
            opacity: 0.7;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .task-description {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 10px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
            flex-wrap: wrap;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .priority-1 {
            background: #d4edda;
            color: #155724;
        }

        .priority-2 {
            background: #fff3cd;
            color: #856404;
        }

        .priority-3 {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-pending {
            background: #cfe2ff;
            color: #084298;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-direction: column;
            min-width: fit-content;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .task-item {
                flex-direction: column;
            }

            .task-actions {
                width: 100%;
                flex-direction: row;
            }

            .action-row {
                width: 100%;
            }

            .action-row button {
                flex: 1;
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Task Manager</h1>

        <div id="message" class="message"></div>

        <!-- Add Task Form -->
        <div class="form-section">
            <h3 style="margin-bottom: 15px; color: #333;">Create New Task</h3>
            <form id="taskForm">
                <div class="form-group">
                    <label for="title">Task Title *</label>
                    <input type="text" id="title" placeholder="Enter task title..." required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Enter task description (optional)"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="1">Low (1)</option>
                            <option value="2">Medium (2)</option>
                            <option value="3">High (3)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate">
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">
                        <span id="submitText">Add Task</span>
                    </button>
                    <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
                </div>
            </form>
        </div>

        <!-- Tasks List -->
        <div class="tasks-section">
            <h2>Your Tasks</h2>
            <div id="tasksList" class="empty-state">
                <p>Loading tasks...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        const taskForm = document.getElementById('taskForm');
        const tasksList = document.getElementById('tasksList');
        const messageBox = document.getElementById('message');
        const clearBtn = document.getElementById('clearBtn');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            taskForm.addEventListener('submit', handleAddTask);
            clearBtn.addEventListener('click', () => taskForm.reset());
        });

        // Show message
        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message show ${type}`;
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 4000);
        }

        // Load all tasks
        async function loadTasks() {
            try {
                tasksList.innerHTML = '<div class="loading"><div class="spinner"></div> Loading tasks...</div>';
                const response = await fetch(`${API_BASE}/tasks`);
                
                if (!response.ok) throw new Error('Failed to load tasks');
                
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                console.error('Error loading tasks:', error);
                tasksList.innerHTML = '<div class="empty-state"><p>❌ Failed to load tasks. Make sure the API is running on port 5000.</p></div>';
                showMessage('Failed to load tasks. Check if API is running.', 'error');
            }
        }

        // Render tasks
        function renderTasks(tasks) {
            if (!tasks || tasks.length === 0) {
                tasksList.innerHTML = '<div class="empty-state"><p>📝 No tasks yet. Create one to get started!</p></div>';
                return;
            }

            tasksList.innerHTML = tasks.map(task => `
                <div class="task-item ${task.status === 'Completed' ? 'completed' : ''}">
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                        <div class="task-meta">
                            <span><strong>Status:</strong> <span class="status-badge status-${task.status.toLowerCase()}">${task.status}</span></span>
                            <span><strong>Priority:</strong> <span class="priority-badge priority-${task.priority}">${getPriorityLabel(task.priority)}</span></span>
                            ${task.dueDate ? `<span>📅 Due: ${new Date(task.dueDate).toLocaleDateString()}</span>` : ''}
                            <span>Created: ${new Date(task.createdAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        ${task.status !== 'Completed' ? `<button class="btn-success" onclick="completeTask(${task.id})">✓ Complete</button>` : ''}
                        <button class="btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Add task
        async function handleAddTask(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const priority = parseInt(document.getElementById('priority').value);
            const dueDate = document.getElementById('dueDate').value;

            if (!title) {
                showMessage('Please enter a task title', 'error');
                return;
            }

            try {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitText').innerHTML = '<span class="spinner"></span>';

                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        description: description || null,
                        priority,
                        dueDate: dueDate ? new Date(dueDate).toISOString() : null
                    })
                });

                if (!response.ok) throw new Error('Failed to create task');

                showMessage('✓ Task created successfully!', 'success');
                taskForm.reset();
                await loadTasks();
            } catch (error) {
                console.error('Error creating task:', error);
                showMessage('Failed to create task', 'error');
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitText').textContent = 'Add Task';
            }
        }

        // Complete task
        async function completeTask(id) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}/complete`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Failed to complete task');

                showMessage('✓ Task completed!', 'success');
                await loadTasks();
            } catch (error) {
                console.error('Error completing task:', error);
                showMessage('Failed to complete task', 'error');
            }
        }

        // Delete task
        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete task');

                showMessage('✓ Task deleted!', 'success');
                await loadTasks();
            } catch (error) {
                console.error('Error deleting task:', error);
                showMessage('Failed to delete task', 'error');
            }
        }

        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getPriorityLabel(priority) {
            const labels = { 1: 'Low', 2: 'Medium', 3: 'High' };
            return labels[priority] || 'Unknown';
        }
    </script>
</body>
</html>
